{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sky Team{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                linear-gradient(rgba(7, 26, 61, 0.78), rgba(11, 35, 79, 0.82)),
                url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
        }

        .auth-card {
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .brand-area {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #0ea5ff, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.6rem;
            box-shadow: 0 10px 25px rgba(29, 78, 216, 0.25);
        }

        .brand-title {
            margin: 0 0 8px;
            font-size: 1.9rem;
            font-weight: 700;
            color: #071a3d;
        }

        .brand-subtitle {
            margin: 0;
            color: #64748b;
            font-size: 0.98rem;
        }

        .auth-card form p {
            margin-bottom: 16px;
        }

        .auth-card label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #1e293b;
        }

        .auth-card input,
        .auth-card select,
        .auth-card textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            outline: none;
            transition: 0.2s ease;
        }

        .auth-card input:focus,
        .auth-card select:focus,
        .auth-card textarea:focus {
            border-color: #0ea5ff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(14, 165, 255, 0.12);
        }

        .auth-card ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
            color: #dc2626;
            font-size: 0.9rem;
        }

        .auth-btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #071a3d, #0b234f);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s ease;
        }

        .auth-btn:hover {
            opacity: 0.95;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.94rem;
            color: #64748b;
        }

        .auth-footer a {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 576px) {
            .auth-card {
                padding: 28px 22px;
            }

            .brand-title {
                font-size: 1.6rem;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-area">
                <div class="brand-icon">
                    <i class="bi bi-buildings"></i>
                </div>
                <h1 class="brand-title">Sky Team</h1>
                <p class="brand-subtitle">
                    {% block auth_subtitle %}
                    Welcome to the Sky Team application
                    {% endblock %}
                </p>
            </div>

            {% block content %}{% endblock %}
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
