{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{% block title %}Sky Team{% endblock %}</title>


   <link
       href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
       rel="stylesheet"
   >
   <link
       rel="stylesheet"
       href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
   >


   <style>
       body {
           margin: 0;
           min-height: 100vh;
           font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
           background: linear-gradient(to right, #b45acb 0 48%, #f7f7f7 48% 100%);
           display: flex;
           align-items: center;
           justify-content: center;
           padding: 0;
       }


       .auth-container {
           width: 100%;
           max-width: 1150px;
           min-height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
           padding: 0;
       }


       .auth-card {
           position: relative;
           width: 100%;
           min-height: 100vh;
           background: transparent;
           border-radius: 0;
           padding: 0;
           box-shadow: none;
           border: none;
           display: flex;
           justify-content: flex-end;
           align-items: center;
           overflow: hidden;
       }


       .auth-card::before {
           content: "";
           position: absolute;
           inset: 0 auto 0 0;
           width: 48%;
           background-color: #b45acb;
           background-image: url("{% static 'Assets/login_page/login-man.png' %}");
           background-repeat: no-repeat;
           background-position: center bottom;
           background-size: contain;
           z-index: 0;
       }


       .auth-card::after {
           content: "";
           position: absolute;
           inset: 0 0 0 auto;
           width: 52%;
           background: #f7f7f7;
           border-left: 1px solid #e3e3e3;
           z-index: 0;
       }


       .brand-area,
       .auth-card > :not(.brand-area) {
           position: relative;
           z-index: 2;
       }


       .brand-area {
           position: absolute;
           top: 40px;
           right: 8%;
           width: 32%;
           text-align: center;
           z-index: 2;
       }


       .brand-area::before {
           content: "";
           display: block;
           width: 220px;
           height: 120px;
           margin: 0 auto 12px;
           background-image: url("{% static 'Assets/Sky_Logo.png' %}");
           background-repeat: no-repeat;
           background-position: center;
           background-size: contain;
       }


       .brand-icon,
       .brand-title,
       .brand-subtitle {
           display: none;
       }


       .sky-login-card {
           position: relative;
           z-index: 2;
           width: 40% !important;
           max-width: none !important;
           margin-right: 6%;
           margin-left: auto;
           margin-top: 80px;
           background: transparent !important;
           box-shadow: none !important;
           border: none !important;
           border-radius: 0 !important;
           padding: 0 !important;
       }


       .sky-login-card .text-center.mb-4 {
           text-align: center !important;
           margin-bottom: 2.2rem !important;
       }


       .sky-login-card h1.h3 {
           font-size: 2.7rem;
           font-weight: 700;
           color: #222;
           margin-bottom: 0.5rem !important;
       }


       .sky-login-card .text-muted {
           color: #7b7b7b !important;
           font-size: 1rem;
       }


       .sky-login-card .alert {
           border-radius: 8px;
           margin-bottom: 1.2rem;
       }


       .sky-login-card .form-label {
           display: block;
           margin-bottom: 8px;
           font-weight: 600;
           color: #2b2b2b;
           font-size: 1rem;
           text-align: left;
       }


       .sky-login-card input,
       .sky-login-card select,
       .sky-login-card textarea {
           width: 100%;
           height: 74px;
           padding: 0 20px;
           border: 1px solid #d7d7d7;
           border-radius: 6px;
           background-color: #f7f7f7;
           outline: none;
           transition: 0.2s ease;
           font-size: 1rem;
           box-shadow: none;
       }


       .sky-login-card input:focus,
       .sky-login-card select:focus,
       .sky-login-card textarea:focus {
           border-color: #cfa2dd;
           background-color: #ffffff;
           box-shadow: none;
       }


       .sky-btn,
       .auth-btn {
           width: 100%;
           height: 72px;
           border: none;
           border-radius: 8px;
           background: #d8aee4 !important;
           color: #ffffff !important;
           font-weight: 500;
           font-size: 1.1rem;
           transition: 0.2s ease;
           box-shadow: none;
           margin-top: 0.8rem;
       }


       .sky-btn:hover,
       .auth-btn:hover {
           background: #cb9edb !important;
           opacity: 1;
       }


       .sky-link,
       .auth-footer a {
           color: #9dbfe9 !important;
           text-decoration: none;
           font-weight: 500;
       }


       .sky-link:hover,
       .auth-footer a:hover {
           color: #7ea9df !important;
       }


       .auth-footer {
           text-align: center;
           margin-top: 20px;
           font-size: 0.94rem;
           color: #64748b;
       }


       @media (max-width: 900px) {
           body {
               background: #f7f7f7;
               padding: 24px;
           }


           .auth-container {
               min-height: auto;
               max-width: 520px;
           }


           .auth-card {
               min-height: auto;
               background: #f7f7f7;
               border-radius: 20px;
               box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
               padding: 2rem 1.5rem;
               display: block;
           }


           .auth-card::before,
           .auth-card::after {
               display: none;
           }


           .brand-area,
           .sky-login-card {
               position: static;
               width: 100% !important;
               margin-left: 0 !important;
               margin-right: 0 !important;
           }


           .brand-area::before {
               width: 180px;
               height: 100px;
               margin-bottom: 18px;
           }


           .sky-login-card {
               margin-top: 0;
           }


           .sky-login-card h1.h3 {
               font-size: 2rem;
           }
       }
   </style>


   {% block extra_css %}{% endblock %}
</head>
<body>
   <div class="auth-container">
       <div class="auth-card">
           <div class="brand-area">
               <div class="brand-icon">
                   <i class="bi bi-buildings"></i>
               </div>
               <h1 class="brand-title">Sky Team</h1>
               <p class="brand-subtitle">
                   {% block auth_subtitle %}
                       Welcome to the Sky Team application
                   {% endblock %}
               </p>
           </div>


           {% block content %}{% endblock %}
       </div>
   </div>


   <script
       src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
   </script>


   {% block extra_js %}{% endblock %}
</body>
</html>
