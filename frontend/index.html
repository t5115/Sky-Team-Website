<!-- Login Page -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky - Login Page</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="styling/index.css">
</head>
<body>
    

    <!--Main Container-->
    <div class="container">

        <!--Container for other half containing image-->
        <div class="left-container">
            <img src="assets/login_page/login-man.png">

        </div>

        <!--Container for Login-->
        <div class="login-container">

            <div id="logo">
                <img src="assets//login_page/sky_logo.svg" alt="Sky Logo">
            </div>

            <div class="info-forms">
                <h3 id="login-text">Login</h3>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">

                <div class="helpers">
                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">Forgot password</a>
                </div>

            </div>

            <div class="login-button">
                <button type="submit">Login</button>
            </div>

            <div id="admin-login">
                <a href="#">Admin Login</a>
            </div>

        </div>

      
    </div>
</body>
</html>
