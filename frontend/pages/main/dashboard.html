<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="../../styling/main/mainTheme.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    
    <!--The main div everything in wrapped in-->
    <div class="main-container">

        <!--Sidebar which will be the same across pages-->
        <div class="main-sidebar">
            <img id="sidebar-sky-logo" src="../../assets/public/sky_logo.svg" alt="sky-logo">

            <!--Icons/Menu Btns-->
            <ul>
                <li class="sidebar-btn" id="dashboard-btn"><i class="bi bi-house-fill"></i>Dashboard</li>
                <li class="sidebar-btn" id="team-btn"><i class="bi bi-people-fill"></i>Teams</li>
                <li class="sidebar-btn" id="organisation-btn"><i class="bi bi-bezier"></i>Organisation</li>
                <li class="sidebar-btn" id="message-btn"><i class="bi bi-envelope-fill"></i>Messages</li>
                <li class="sidebar-btn" id="schedule-btn"><i class="bi bi-calendar-fill"></i>Schedule</li>
                <li class="sidebar-btn" id="report-btn"><i class="bi bi-card-text"></i>Reports</li>
            </ul>

        </div>

        <!--Right side box holds topbar and the content part-->
        <div class="content-box">

            <!--Topbar-->
            <div class="main-topbar">
                <a>topbar</a>
            </div>

            <!--Main activity of code here-->
            <div class="dash">
                <a>main part</a>
            </div>

        </div>

    </div>

</body>
</html>
