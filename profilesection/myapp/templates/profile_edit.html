{% extends "base.html" %}

{% block title %}
  Edit Profile
{% endblock %}

{% block content %}
<div class="mt-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-4">Edit Profile</h2>

      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            value="{{ profile.name }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <input
            type="text"
            class="form-control"
            id="department"
            name="department"
            value="{{ profile.department }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <input
            type="text"
            class="form-control"
            id="role"
            name="role"
            value="{{ profile.role }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="team">Team</label>
          <input
            type="text"
            class="form-control"
            id="team"
            name="team"
            value="{{ profile.team }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            value="{{ profile.email }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone_number">Phone Number</label>
          <input
            type="text"
            class="form-control"
            id="phone_number"
            name="phone_number"
            value="{{ profile.phone_number }}"
            required
          />
        </div>

        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{% url 'profile_view' profile.id %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
