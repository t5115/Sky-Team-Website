{% extends "base.html" %}

{% block title %}Password reset complete{% endblock %}

{% block content %}
<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center sky-login-bg py-4">
    <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 sky-login-card" style="width: 100%; max-width: 520px;">
        <div class="text-center mb-4">
            <div class="mb-3">
                <span class="badge rounded-pill text-bg-primary px-3 py-2">SKY</span>
            </div>
            <h1 class="h3 fw-bold mb-2">Password reset complete</h1>
            <p class="text-muted mb-0">Your password has been updated successfully.</p>
        </div>

<a href="{% url 'CustomLoginView' %}" class="btn sky-btn w-100 py-2 fw-semibold">
            Go to login
        </a>
    </div>
</div>
{% endblock %}
