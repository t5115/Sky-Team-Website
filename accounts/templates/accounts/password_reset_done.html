{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center sky-login-bg py-4">
    <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 sky-login-card" style="width: 100%; max-width: 520px;">
        <div class="text-center mb-4">
            <div class="mb-3">
                <span class="badge rounded-pill text-bg-primary px-3 py-2">SKY</span>
            </div>
            <h1 class="h3 fw-bold mb-2">Check your email</h1>
            <p class="text-muted mb-0">If the email address exists in our system, a password reset link has been sent.</p>
        </div>

<div class="alert alert-info mb-4" role="alert">
            Please check your inbox and spam folder.
        </div>

        <a href="{% url 'CustomLoginView' %}" class="btn sky-btn w-100 py-2 fw-semibold">
            Back to login
        </a>
    </div>
</div>
{% endblock %}
